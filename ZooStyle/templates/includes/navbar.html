{% load static %}

<header class="navbar-container">
    <div class="navbar-wrapper">
        <a href="{% url 'home' %}" class="navbar-logo-link">
            <img src="{% static 'images/logo.png' %}" alt="Логотип ZooStyle" class="navbar-logo">
        </a>

        <nav class="navbar-nav">
            <a href="{% url 'shop_app:shop_home' %}">Магазин</a>

            {% if not request.user.is_authenticated %}
                <a href="{% url 'accounts_app:login' %}">Войти</a>
                <a href="{% url 'accounts_app:signup' %}">Зарегистрироваться</a>
             {% else %}
                <p>{{request.user.username}}</p>
                <a href="{% url 'accounts_app:profile' %}" class="profile-link">Профиль</a>
             {% endif %}
        </nav>
    </div>
</header>
