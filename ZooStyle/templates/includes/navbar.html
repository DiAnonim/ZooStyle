{% load static %}

<section style="background-color: rgb(251, 227, 253);">
    <div>
    <a href="{% url 'home' %}" style="display: flex; align-items: center; text-decoration: none; color: black;">
            <img src="{% static 'images/logo.png' %}" alt="Логотип ZooStyle" style="height: 50px; margin-right: 10px;">
    </a>
    </div>

    <div>
    {% if not request.user.is_authenticated %}
        <a href="{% url 'accounts_app:login' %}">Войти</a>
        <a href="{% url 'accounts_app:signup' %}">Зарегистрироваться</a>
     {% else %}
        <p>{{request.user.username}}</p>
        <a href="{% url 'accounts_app:profile' %}">Профиль</a>
     {% endif %}
    </div>
</section>
