{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zoo Style{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
</head>
<nav>
{% include "includes/navbar.html" %}
</nav>
<body style="background-image: url('{% static 'images/back.jpg' %}'); background-size: cover; background-repeat: no-repeat; background-attachment: fixed; height: 100vh; margin: 0;">
    <div>
        {% block content %}{% endblock %}
    </div>
</body>

</html>
