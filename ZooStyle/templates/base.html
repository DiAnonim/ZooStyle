{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Zoo Style{% endblock %}</title>

    <!-- Styles -->
    <link rel="stylesheet" href="{% static '/css/navbar.css' %}">
    <link rel="stylesheet" href="{% static '/css/footer.css' %}">
    <link rel="stylesheet" href="{% static 'shop_app/css/style_home_shop.css' %}">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<navbar class="site-navbar">
{% include "includes/navbar.html" %}
</navbar>

<body style="background-image: url('{% static 'images/back.jpg' %}'); background-size: cover; background-repeat: no-repeat; background-attachment: fixed; height: 100vh; margin: 0;">
    <div>
        {% block content %}{% endblock %}
    </div>

    
    <script src="{% static 'shop_app/js/shop_app_script.js' %}"></script>
</body>

<footer class="site-footer">
    {% include "includes/footer.html" %}
</footer>

</html>
